<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <title>Aarvi Delivery Partner</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  
  <style>
    :root {
      --bg-color: #f1f3f6; 
      --surface-color: #ffffff;
      --text-main: #000000;
      --text-sub: #666666;
      --border: #e0e0e0;
      --primary: #2874f0; 
      --header-height: 65px;
      --danger: #d32f2f;
      --skeleton-base: #e0e0e0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000; 
        --surface-color: #121212;
        --text-main: #ffffff;
        --text-sub: #a0a0a0;
        --border: #333333;
        --danger: #f28b82;
        --skeleton-base: #333333;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; }
    
    body, html { background-color: var(--bg-color); color: var(--text-main); height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }

    /* --- Top Header --- */
    header { height: var(--header-height); background-color: var(--surface-color); display: none; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 50; flex-shrink: 0; border-bottom: 1px solid var(--border); transition: opacity 0.3s ease; }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
    .brand img { width: 28px; height: 28px; object-fit: contain; border-radius: 6px; }
    .agent-badge { background: var(--text-main); color: var(--surface-color); font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 50px; letter-spacing: 1px; text-transform: uppercase; margin-left: 4px; }
    
    .dp-wrapper { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; background-color: var(--skeleton-base); transition: transform 0.15s; }
    .dp-wrapper:active { transform: scale(0.9); }
    .dp-wrapper img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.3s; }

    /* --- Main Layout Wrapper --- */
    .layout-wrapper { display: flex; flex: 1; overflow: hidden; position: relative; width: 100%; background: var(--bg-color); }
    
    /* --- Iframe Container --- */
    #content-frame { width: 100%; height: 100%; border: none; background: transparent; display: block; }

    /* --- Permission Denied Overlay --- */
    #permission-denied-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-color); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; backdrop-filter: blur(5px); }
    #permission-denied-overlay svg { width: 72px; height: 72px; stroke: var(--danger); margin-bottom: 20px; }
    #permission-denied-overlay h2 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    #permission-denied-overlay p { color: var(--text-sub); font-size: 15px; line-height: 1.5; max-width: 400px; margin-bottom: 24px; }
    .btn-switch { background: var(--surface-color); color: var(--text-main); border: 1.5px solid var(--border); padding: 14px 24px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.1s; }
    .btn-switch:active { transform: scale(0.96); }

    /* --- Install Pill --- */
    #install-pill { position: fixed; bottom: env(safe-area-inset-bottom, 20px); left: 50%; transform: translateX(-50%) translateY(150px); background-color: var(--text-main); color: var(--surface-color); padding: 14px 28px; border-radius: 50px; font-size: 15px; font-weight: 800; box-shadow: 0 8px 24px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px; cursor: pointer; z-index: 100; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    #install-pill.show { transform: translateX(-50%) translateY(-20px); }
    #install-pill svg { width: 20px; height: 20px; stroke: currentColor; }

    /* --- Logout Confirmation Modal (Hardware Back Supported) --- */
    .confirm-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 3000; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(4px); }
    .confirm-overlay.active { opacity: 1; pointer-events: auto; }
    
    .confirm-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95); background: var(--surface-color); width: 90%; max-width: 320px; border-radius: 20px; padding: 24px; z-index: 3001; opacity: 0; pointer-events: none; transition: all 0.2s cubic-bezier(0.32, 0.72, 0, 1); box-shadow: 0 10px 40px rgba(0,0,0,0.2); text-align: center; }
    .confirm-modal.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
    
    .confirm-title { font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
    .confirm-desc { font-size: 14px; color: var(--text-sub); margin-bottom: 24px; line-height: 1.5; }
    .confirm-actions { display: flex; gap: 12px; }
    
    .btn-dialog { flex: 1; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; transition: transform 0.1s; }
    .btn-dialog:active { transform: scale(0.96); }
    .btn-dialog.cancel { background: var(--skeleton-base); color: var(--text-main); }
    .btn-dialog.danger { background: var(--danger); color: white; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.25); }

    /* Utility Lock */
    .nav-locked { pointer-events: none !important; opacity: 0.4 !important; filter: grayscale(0.6) !important; }
  </style>
</head>
<body>

  <!-- Permission Denied Overlay -->
  <div id="permission-denied-overlay">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
    <h2>Access Restricted</h2>
    <p>Your account is not registered as a delivery agent. Please contact the administrator.</p>
    <button class="btn-switch" id="btn-switch-account">Switch Account</button>
  </div>

  <!-- Persistent App Header -->
  <header id="app-header">
    <div class="brand">
      <img src="images/icon.png" alt="Logo" onerror="this.style.display='none'">
      Aarvi <span class="agent-badge">DRIVER</span>
    </div>
    <div class="dp-wrapper" id="btn-logout">
      <img id="user-dp" src="" alt="Profile">
    </div>
  </header>

  <!-- Iframe Content Shell -->
  <div class="layout-wrapper" id="layout-wrapper">
    <iframe src="about:blank" id="content-frame" name="content-frame" title="App Content"></iframe>
  </div>

  <!-- Logout Confirmation Modal -->
  <div class="confirm-overlay" id="logout-overlay"></div>
  <div class="confirm-modal" id="logout-modal">
    <div class="confirm-title">Sign Out</div>
    <div class="confirm-desc">Are you sure you want to sign out of the Delivery Portal?</div>
    <div class="confirm-actions">
      <button class="btn-dialog cancel" id="logout-cancel">Cancel</button>
      <button class="btn-dialog danger" id="logout-confirm">Sign Out</button>
    </div>
  </div>

  <!-- Install App Pill -->
  <div id="install-pill">
    <svg fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    Install Delivery App
  </div>

  <script type="module">
    import { auth, db } from './config.js';
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // 1. Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW Failed', err));
      });
    }

    // UI Elements
    const appHeader = document.getElementById('app-header');
    const contentFrame = document.getElementById('content-frame');
    const dpImg = document.getElementById('user-dp');
    const btnLogout = document.getElementById('btn-logout');
    const deniedOverlay = document.getElementById('permission-denied-overlay');
    const btnSwitchAccount = document.getElementById('btn-switch-account');

    // Logout Modal Elements
    const logoutOverlay = document.getElementById('logout-overlay');
    const logoutModal = document.getElementById('logout-modal');
    let isLogoutModalOpen = false;

    // 0ms Profile Picture Boot
    const localDpUrl = localStorage.getItem('aarvi_agent_dp');
    if (localDpUrl) {
      dpImg.src = localDpUrl;
      dpImg.style.opacity = '1';
    }

    // Expose UI reveal to child frames
    window.revealAppShell = function() {
      appHeader.style.display = 'flex';
    };

    // 2. Auth Protection & Smart Auto-Provisioning
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        // NOT LOGGED IN: Hide shell, route iframe to login
        appHeader.style.display = 'none';
        deniedOverlay.style.display = 'none';
        localStorage.removeItem('aarvi_agent_login');
        btnLogout.classList.remove('nav-locked');
        contentFrame.src = "pages/login.html";
      } else {
        // Optimistic Load
        window.revealAppShell();
        const currentSrc = contentFrame.src || "";
        if (currentSrc.includes('login.html') || currentSrc.includes('index.html') || currentSrc === "about:blank") {
          contentFrame.src = "pages/home.html";
        }

        // Fast Cache Lock
        const isCachedAgent = localStorage.getItem('aarvi_agent_login');
        if (isCachedAgent === 'true') {
            deniedOverlay.style.display = 'none';
            btnLogout.classList.remove('nav-locked');
            
            if (user.photoURL && user.photoURL !== localDpUrl) {
              const tempImg = new Image();
              tempImg.onload = () => { dpImg.src = tempImg.src; dpImg.style.opacity = '1'; localStorage.setItem('aarvi_agent_dp', tempImg.src); };
              tempImg.src = user.photoURL;
            }
            return;
        }

        // Verify or Provision Agent in DB
        try {
          const userRef = doc(db, 'users', user.uid);
          const userSnap = await getDoc(userRef);
          let isAgent = false;

          if (!userSnap.exists()) {
             try {
               await setDoc(userRef, {
                 name: user.displayName || 'Agent',
                 email: user.email || '',
                 photoURL: user.photoURL || '',
                 agent: true, // Auto-provision as agent
                 createdAt: new Date().toISOString()
               }, { merge: true });
               isAgent = true;
             } catch (error) { console.error("Auto-provision failed", error); }
          } else {
             isAgent = userSnap.data().agent === true;
          }

          if (isAgent) {
            localStorage.setItem('aarvi_agent_login', 'true');
            deniedOverlay.style.display = 'none';
            btnLogout.classList.remove('nav-locked');

            if (user.photoURL && user.photoURL !== localDpUrl) {
              const tempImg = new Image();
              tempImg.onload = () => { dpImg.src = tempImg.src; dpImg.style.opacity = '1'; localStorage.setItem('aarvi_agent_dp', tempImg.src); };
              tempImg.src = user.photoURL;
            }
          } else {
            localStorage.removeItem('aarvi_agent_login');
            deniedOverlay.style.display = 'flex';
            btnLogout.classList.add('nav-locked');
          }
        } catch (error) {
          console.error("DB Verification Error:", error);
          deniedOverlay.style.display = 'flex';
          btnLogout.classList.add('nav-locked');
        }
      }
    });

    // Handle iframe internal loads to prevent recursive nesting
    contentFrame.addEventListener('load', () => {
      try {
        const frameUrl = contentFrame.contentWindow.location.href;
        if (auth.currentUser && localStorage.getItem('aarvi_agent_login') && (frameUrl.includes('login.html') || frameUrl.includes('index.html'))) {
           contentFrame.src = "pages/home.html";
        }
      } catch (e) {}
    });

    // 3. Switch Account Logic
    btnSwitchAccount.addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate(15);
      signOut(auth);
    });

    // 4. Native Logout Modal Logic
    btnLogout.addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate(15);
      logoutOverlay.classList.add('active');
      logoutModal.classList.add('active');
      isLogoutModalOpen = true;
      history.pushState({ modal: 'logout' }, '');
    });

    function closeLogoutModal() {
      logoutOverlay.classList.remove('active');
      logoutModal.classList.remove('active');
      isLogoutModalOpen = false;
    }

    window.addEventListener('popstate', (e) => {
      if (isLogoutModalOpen) closeLogoutModal();
    });

    document.getElementById('logout-cancel').addEventListener('click', () => {
      if (isLogoutModalOpen) history.back();
    });

    logoutOverlay.addEventListener('click', () => {
      if (isLogoutModalOpen) history.back();
    });

    document.getElementById('logout-confirm').addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate([15, 30, 15]);
      if (isLogoutModalOpen) history.back();
      signOut(auth);
    });

    // 5. PWA Install Logic
    let deferredPrompt;
    const installPill = document.getElementById('install-pill');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); 
      deferredPrompt = e;
      setTimeout(() => installPill.classList.add('show'), 3000);
    });

    installPill.addEventListener('click', async () => {
      if (navigator.vibrate) navigator.vibrate(40);
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') console.log('Delivery PWA Installed');
        deferredPrompt = null;
        installPill.classList.remove('show');
      }
    });

    window.addEventListener('appinstalled', () => {
      installPill.classList.remove('show');
      deferredPrompt = null;
    });
  </script>
</body>
</html>
